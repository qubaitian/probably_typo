<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>probably_typo</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <style>
    html, body, #term { height: 100%; margin: 0; background: #14110f; overflow: hidden; }
    /* 浏览器别按上下文调整标点和字距,终端每个字都要占固定格数 */
    .xterm { text-spacing-trim: space-all; text-autospace: no-autospace; font-kerning: none; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script src="/vendor/xterm.js"></script>
  <script src="/vendor/addon-fit.js"></script>
  <script>
    const term = new Terminal({
      fontFamily: 'Menlo, "PingFang SC", monospace',
      fontSize: 16,
      theme: { background: '#14110f', foreground: '#e8dcc8' },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term'));
    fit.fit();
    term.focus();

    const ws = new WebSocket(`ws://${location.host}/ws?cols=${term.cols}&rows=${term.rows}`);
    ws.binaryType = 'arraybuffer';
    const send = (message) => {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(message));
    };

    ws.onmessage = (event) => term.write(new Uint8Array(event.data));
    ws.onclose = () => term.write('\r\n\x1b[2m连接断开,刷新页面重开\x1b[0m');
    term.onData((input) => send({ input }));
    term.onResize(({ cols, rows }) => send({ cols, rows }));
    window.addEventListener('resize', () => fit.fit());
    document.addEventListener('click', () => term.focus());
  </script>
</body>
</html>
